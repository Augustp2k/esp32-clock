name: Update ESP32 clock feed

on:
  schedule:
    # GitHub cron uses UTC. Minute 17 helps avoid the top-of-hour queue spike.
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "images/**"
      - "quotes.txt"
      - "config.json"
      - "update.py"
      - "requirements.txt"
      - "tests/**"
      - "public/index.html"
      - "public/.nojekyll"
      - ".github/workflows/update.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: esp32-clock-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install image dependency
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build current feed
        run: python update.py

      - name: Save generated feed to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/today.json public/today.jpg
          if git diff --cached --quiet; then
            echo "Generated files are already current."
          else
            git commit -m "chore: refresh ESP32 clock feed"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
